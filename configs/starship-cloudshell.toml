"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

# Variante sin íconos Nerd Font: el panel de terminal de Cloud Shell Editor
# elige la fuente desde un dropdown fijo del propio producto (confirmado
# con el usuario) — no acepta fuentes personalizadas, así que cualquier
# glifo Nerd Font (incluidas las puntas tipo powerline "" "") se ve como
# rectángulo. Se mantienen los colores y la estructura MD3, con bloques
# planos y separadores en Unicode estándar en vez de puntas powerline.
format = """
$os\
$username\
$hostname\
 \
$directory\
$git_branch\
$git_status\
$fill\
$nodejs\
$python\
$rust\
$golang\
$java\
$cmd_duration\
$time
$line_break
[╰ ](dim #FF6D00)$character """

[os]
disabled = true

[username]
show_always = true
format = "[ $user](bg:#FF6D00 fg:#1C1B1F bold)"
style_user = "bg:#FF6D00 fg:#1C1B1F bold"
style_root = "bg:#CF6679 fg:#FFFFFF bold"

[hostname]
ssh_only = false
# Cloud Shell hostnames son IDs largos (cs-621056412115-default).
# Se usa "CSE" (Cloud Shell Editor) para mantener el prompt limpio.
format = "[@CSE ](bg:#FF6D00 fg:#1C1B1F bold)"

[directory]
format = "[ $path$read_only ]($style)"
style = "bg:#2B2930 fg:#82AAFF bold"
truncation_length = 4
truncate_to_repo = true
read_only = " ro"
read_only_style = "bg:#2B2930 fg:#CF6679"

[git_branch]
format = "[ $branch ]($style)"
style = "bg:#00897B fg:#FFFFFF bold"
truncation_length = 50

[git_status]
format = "[$all_status$ahead_behind]($style)"
style = "bg:#00897B fg:#FFD740 bold"
conflicted  = "! "
ahead       = "↑${count} "
behind      = "↓${count} "
diverged    = "↕${ahead_count}/${behind_count} "
untracked   = "? "
stashed     = "$ "
modified    = "~ "
staged      = "+ "
renamed     = "» "
deleted     = "✗ "

[fill]
symbol = "─"
style  = "#49454F"

[nodejs]
format = "[ node $version ]($style)"
style  = "bg:#2B2930 fg:#68A063 bold"

[python]
format = "[ py $version ]($style)"
style  = "bg:#2B2930 fg:#FFDE57 bold"

[rust]
format = "[ rs $version ]($style)"
style  = "bg:#2B2930 fg:#FF6B35 bold"

[golang]
format = "[ go $version ]($style)"
style  = "bg:#2B2930 fg:#00ACD7 bold"

[java]
format = "[ java $version ]($style)"
style  = "bg:#2B2930 fg:#ED8B00 bold"

[cmd_duration]
format     = "[ $duration ]($style)"
style      = "bg:#2B2930 fg:#FFB74D"
min_time   = 2_000
show_milliseconds = false

[time]
disabled     = false
format       = "[ $time ]($style)"
style        = "bg:#FF6D00 fg:#1C1B1F bold"
time_format  = "%H:%M:%S"

[character]
success_symbol  = "[❯](bold #69F0AE)"
error_symbol    = "[❯](bold #CF6679)"
vimcmd_symbol   = "[❮](bold #82AAFF)"
