name: Criterios

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

jobs:
  criterios:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Obtener validador
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Comprobar casillas y evidencia del SHA y base vigentes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/check-issue-criteria.py --repository "$REPOSITORY" --pr "$PR_NUMBER"
