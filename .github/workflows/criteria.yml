name: Criterios

on:
  # Compatibilidad manual para evidencia legacy de Actions.
  # La evidencia de auditoría local se valida desde la terminal responsable.
  workflow_dispatch:
    inputs:
      pr:
        description: Número del PR con evidencia de Actions
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

jobs:
  criterios:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Obtener validador
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Comprobar casillas y evidencia del SHA y base vigentes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
          REPOSITORY: ${{ github.repository }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/check-issue-criteria.py --repository "$REPOSITORY" --pr "$PR_NUMBER"
